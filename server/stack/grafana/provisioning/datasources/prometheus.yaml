apiVersion: 1
datasources:
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    editable: true
    jsonData:
      timeInterval: "10s"
      scrapeInterval: "15s"
      queryTimeout: "60s"
      incrementalQueries: true
      minTimeInterval: "10s"
      httpMethod: POST
      customQueryParameters: ""
      minStep: "1s"
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: tempo
    secureJsonData: {}
