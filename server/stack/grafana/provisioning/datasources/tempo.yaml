apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogs:
        datasourceUid: P8E80F9AEF21F6940
        filterByTraceID: true
        filterBySpanID: false
        lokiSearch: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      tracesToMetrics:
        datasourceUid: PBFA97CFB590B2093
        tags:
          - key: "service.name"
            value: "service_name"
          - key: "service.namespace"
            value: "service_namespace"
        queries:
          - name: "Request Rate"
            query: 'rate(http_server_request_duration_seconds_count{service_name="$${__tags.service_name}", service_namespace="$${__tags.service_namespace}"}[5m])'
          - name: "Request Duration P95"
            query: 'histogram_quantile(0.95, rate(http_server_request_duration_seconds_bucket{service_name="$${__tags.service_name}", service_namespace="$${__tags.service_namespace}"}[5m]))'
          - name: "Error Rate"
            query: 'rate(http_server_request_duration_seconds_count{service_name="$${__tags.service_name}", service_namespace="$${__tags.service_namespace}", http_response_status_code=~"5.."}[5m])'
          - name: "JVM Memory Used"
            query: 'jvm_memory_used_bytes{service_name="$${__tags.service_name}", service_namespace="$${__tags.service_namespace}"}'
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      tracesToProfiles:
        datasourceUid: Pyroscope
        tags:
          - key: "service.name"
            value: "service_name"
          - key: "service.namespace"
            value: "service_namespace"
        profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
        query: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds{service_name="$${__tags.service_name}", service_namespace="$${__tags.service_namespace}"}'
        customQuery: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      search:
        hide: false
      serviceMap:
        datasourceUid: PBFA97CFB590B2093
