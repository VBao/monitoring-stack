server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  ring:
    kvstore:
      store: inmemory

# Tempo 3.x has no `ingester:` block. The write path is split into a live-store
# (holds recent traces and answers queries on them) and a block-builder (flushes
# completed blocks to the backend), and `compactor:` is replaced by
# backend_scheduler/backend_worker. Both run in-process under -target=all and
# need no Kafka — the `ingest:` block is only for the distributed deployment.
# Their WAL paths default beneath /var/tempo, which is the persistent volume, so
# traces still survive a restart. The old ingester tuning
# (trace_idle_period / max_block_bytes / max_block_duration) is deliberately not
# carried over: recent traces are served from the live-store regardless of flush
# cadence, so the upstream defaults apply with no change in query behaviour.
#
# The `local-blocks` metrics-generator processor was removed in 3.x along with
# its local block storage; the live-store answers those queries instead, so
# listing it in the overrides below only earns a warning every 10s.
#
# The OTLP receiver endpoints stay written out in full because 3.x changed the
# receiver default from all interfaces to localhost, which would silently stop
# accepting traces from the other containers.

metrics_generator:
  registry:
    collection_interval: 15s
    stale_duration: 15m
  storage:
    path: /var/tempo/metrics
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  ring:
    kvstore:
      store: inmemory

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

querier:
  max_concurrent_queries: 20

query_frontend:
  max_outstanding_per_tenant: 2000

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both
