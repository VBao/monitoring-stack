# ========================================
# Java Spring Boot - OTLP Configuration
# ========================================
# Add this to your application.yml or application.properties

# ========================================
# Option 1: application.yml (YAML format)
# ========================================

spring:
  application:
    name: ${SERVICE_NAME:my-service}  # Your service name

management:
  # OpenTelemetry configuration
  otlp:
    # Metrics export
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://monitoring-server:4318}/v1/metrics
        step: 10s

    # Tracing export
    tracing:
      export:
        enabled: true
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://monitoring-server:4317}

  # Expose endpoints
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Logging configuration
logging:
  pattern:
    # JSON format for better parsing
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger{36}","message":"%msg","trace_id":"%X{trace_id}","span_id":"%X{span_id}"}%n'
  level:
    root: INFO
    com.yourpackage: DEBUG

# ========================================
# Option 2: application.properties
# ========================================

# Service name
# spring.application.name=my-service

# OTLP Metrics
# management.otlp.metrics.export.enabled=true
# management.otlp.metrics.export.url=http://monitoring-server:4318/v1/metrics
# management.otlp.metrics.export.step=10s

# OTLP Tracing
# management.otlp.tracing.export.enabled=true
# management.otlp.tracing.export.endpoint=http://monitoring-server:4317

# Logging
# logging.level.root=INFO
# logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","message":"%msg","trace_id":"%X{trace_id}"}%n

