# ========================================
# Environment Variables (Alternative)
# ========================================

# Set these in your deployment environment:
#
# export OTEL_SERVICE_NAME="hrms-backend-uat"
# export OTEL_SERVICE_NAMESPACE="hrms"
# export OTEL_EXPORTER_OTLP_ENDPOINT="http://monitoring-server:4318"
# export OTEL_EXPORTER_OTLP_PROTOCOL="http/protobuf"
# export OTEL_RESOURCE_ATTRIBUTES="deployment.environment=uat,service.version=1.0.0"
# export OTEL_LOGS_EXPORTER="otlp"
# export OTEL_METRICS_EXPORTER="otlp"
# export OTEL_TRACES_EXPORTER="otlp"

