# ========================================
# Testing Configuration
# ========================================

# 1. Start your application
# 2. Check logs for OTLP export messages
# 3. Verify connection:
#
#    curl http://monitoring-server:4318/v1/logs -v
#
# 4. Generate test log:
#
#    curl http://localhost:8080/actuator/loggers/com.yourpackage \
#      -X POST \
#      -H 'Content-Type: application/json' \
#      -d '{"configuredLevel":"DEBUG"}'
#
# 5. Check Grafana:
#    - Open: http://monitoring-server:3002
#    - Explore → Loki
#    - Query: {service_name="my-service"}

# ========================================
# Troubleshooting
# ========================================

# Enable OTLP debug logging:
# logging.level.io.opentelemetry=DEBUG
# logging.level.io.micrometer=DEBUG

# Check if OTLP exporter is working:
# Look for logs like:
# - "Exporting to OTLP endpoint..."
# - "OTLP export completed successfully"

# If connection fails:
# - Verify monitoring-server hostname resolves
# - Check network connectivity: telnet monitoring-server 4318
# - Verify Alloy is running: docker ps | grep alloy
# - Check firewall rules

# ========================================
# Performance Tuning
# ========================================

# Batch size and intervals:
# management.otlp.metrics.export.batch-size=512
# management.otlp.metrics.export.step=10s

# Connection timeout:
# management.otlp.metrics.export.connect-timeout=10s
# management.otlp.metrics.export.read-timeout=30s

# Queue size (for buffering):
# otel.bsp.max.queue.size=2048
# otel.bsp.max.export.batch.size=512
# otel.bsp.schedule.delay=5000

